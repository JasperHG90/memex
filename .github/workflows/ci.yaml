name: CI

on:
  pull_request:
    branches:
      - main
      - release/tier-a-cognitive-memory
      - memory_augmentation
  push:
    branches:
      - main
      - memory_augmentation

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.11.x'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    outputs:
      python: ${{ steps.filter.outputs.python }}
      firefox-extension: ${{ steps.filter.outputs.firefox-extension }}
      docker: ${{ steps.filter.outputs.docker }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
      hermes-runner: ${{ steps.filter.outputs.hermes-runner }}
      hermes-plugin: ${{ steps.filter.outputs.hermes-plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'packages/core/**'
              - 'packages/cli/**'
              - 'packages/mcp/**'
              - 'packages/common/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - 'scripts/ci/**'
            firefox-extension:
              - 'packages/firefox-extension/**'
            docker:
              - 'docker/**'
              - 'docker-compose.yaml'
              - '.dockerignore'
            ci-config:
              - '.github/workflows/ci.yaml'
            hermes-runner:
              - '.github/actions/hermes/**'
            hermes-plugin:
              - 'packages/hermes-plugin/**'
              - 'packages/common/**'
              - 'packages/core/**'
              - 'pyproject.toml'
              - 'uv.lock'

  pre-commit:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run pre-commit checks
        uses: JasperHG90/toiminnot/actions/prek@main
        with:
          python_version: ${{ env.PYTHON_VERSION }}
          prek_version: '0.2.25'
        env:
          SKIP: "update-test-badge"

  python-tests:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Run unit tests
        uses: JasperHG90/toiminnot/actions/pytest@main
        with:
          directory: tests
          uv_version: ${{ env.UV_VERSION }}
          python_version: ${{ matrix.python-version }}
          markers: "not integration"
      - name: Run integration tests
        uses: JasperHG90/toiminnot/actions/pytest@main
        with:
          directory: tests
          uv_version: ${{ env.UV_VERSION }}
          python_version: ${{ matrix.python-version }}
          markers: "integration and not llm"
      # packages/core has its own unit + integration suites (incl. the alembic
      # migration round-trip tests) that previously ran in NO CI job — a broken
      # 055 migration shipped green because of it. Run them here. Target the
      # unit/ and integration/ subdirs directly: the integration conftest spins
      # a Postgres testcontainer at import, so the unit step must not collect it.
      - name: Run core package unit tests
        uses: JasperHG90/toiminnot/actions/pytest@main
        with:
          directory: packages/core/tests/unit
          uv_version: ${{ env.UV_VERSION }}
          python_version: ${{ matrix.python-version }}
          markers: "not llm"
      - name: Run core package integration tests
        uses: JasperHG90/toiminnot/actions/pytest@main
        with:
          directory: packages/core/tests/integration
          uv_version: ${{ env.UV_VERSION }}
          python_version: ${{ matrix.python-version }}
          markers: "integration and not llm"

  mcp-import-check:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-extras --all-packages
      - name: Collect MCP tests (import-time gate)
        run: uv run pytest packages/mcp/tests --collect-only -q

  firefox-extension-lint-test:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.firefox-extension == 'true' || needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'packages/firefox-extension/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: packages/firefox-extension
      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/firefox-extension
      - name: Build
        run: npm run build
        working-directory: packages/firefox-extension
      - name: Lint (web-ext)
        run: npm run lint
        working-directory: packages/firefox-extension
      - name: Unit tests
        run: npm test
        working-directory: packages/firefox-extension
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
        working-directory: packages/firefox-extension
      - name: E2E tests
        run: npm run test:e2e
        working-directory: packages/firefox-extension

  # LLM tests — requires ANTHROPIC_API_KEY secret
  # Uses @pytest.mark.llm marker
  # Enable by removing the `if: false` condition
  llm-tests:
    if: false
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run LLM tests
        uses: JasperHG90/toiminnot/actions/pytest@main
        with:
          directory: tests
          uv_version: ${{ env.UV_VERSION }}
          python_version: ${{ env.PYTHON_VERSION }}
          markers: "llm"

  hermes-runner-tests:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.hermes-runner == 'true' || needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install runner (with dev extras)
        run: uv sync --extra dev
        working-directory: .github/actions/hermes/runner
      - name: Run runner tests
        run: uv run pytest
        working-directory: .github/actions/hermes/runner

  # Hermes plugin integration tests (packages/hermes-plugin/tests/integration/)
  # Requirements:
  #   - Docker daemon (testcontainers spins up pgvector Postgres)
  #   - hermes-agent installed via the `hermes-integration` dependency group
  # Tests are gated by the `hermes_integration` pytest marker; the suite
  # skips itself if Docker or hermes-agent is unavailable, so this job is
  # safe even on runners that lack one of those prerequisites.
  hermes-integration:
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.hermes-plugin == 'true' || needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync workspace with hermes-integration group
        run: uv sync --all-extras --all-packages --group hermes-integration
      # Cache the ONNX models (embedding / reranker / NER / NLI) the server
      # warms at startup. On a cold cache the integration suite's server-boot
      # fixture prefetches them (~200MB from HF Hub); restoring the cache makes
      # repeat runs fast and removes the download from the boot path entirely.
      # Key hashes the model registry so a revision bump invalidates the cache.
      - name: Cache Memex ONNX models
        uses: actions/cache@v4
        with:
          path: ~/.cache/memex
          key: memex-models-${{ hashFiles('packages/core/src/memex_core/memory/models/base.py') }}
      - name: Run hermes-plugin integration tests
        run: uv run pytest packages/hermes-plugin/tests/integration/ -v --tb=short -m hermes_integration

  build-python:
    needs: [changes, pre-commit, python-tests, mcp-import-check]
    if: always() && !failure() && !cancelled() && (github.event_name == 'push' || needs.changes.outputs.python == 'true' || needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        package: [memex_core, memex_cli, memex_common, memex_mcp]
    steps:
      - name: Build package
        uses: JasperHG90/toiminnot/actions/uv_build@main
        with:
          uv_version: ${{ env.UV_VERSION }}
          python_version: ${{ env.PYTHON_VERSION }}
          package: ${{ matrix.package }}

  docker-build-memex:
    needs: [changes, pre-commit, python-tests, mcp-import-check]
    if: >-
      always() && !failure() && !cancelled() &&
      (github.event_name == 'push' ||
       needs.changes.outputs.python == 'true' ||
       needs.changes.outputs.docker == 'true' ||
       needs.changes.outputs.ci-config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/memex/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
