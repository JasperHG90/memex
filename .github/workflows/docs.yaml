name: Docs

# Manual-only trigger so a docs release ships when an operator decides
# it is ready — not on every commit to main. Re-add a `push` filter
# here if you want CI-driven publishes later.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build the docs from (defaults to the branch the workflow is launched on).'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Only one docs build/deploy may be in flight at a time; queue subsequent
# triggers and skip stale ones in the queue.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.10.x'

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync the docs dependency group
        run: uv sync --group docs

      - name: Build the docs
        run: uv run zensical build

      # The site_url in zensical.toml is https://memex.bot — emit a CNAME
      # alongside the built assets so GitHub Pages serves the site under
      # that custom domain. Drop this step (and remove the DNS record) to
      # ship under the default `*.github.io` URL instead.
      - name: Write CNAME for custom domain
        run: echo "memex.bot" > site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
