[project]
name = "memex-eval"
dynamic = ["version"]
description = "Quality benchmarks for the Memex memory system."
authors = [
  {name="Jasper Ginn", email="jasperginn@gmail.com"}
]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "memex-common",
    "memex-core",
    "httpx>=0.27",
    "rich>=13",
    "typer>=0.12",
    "dspy>=3.1.0",
    "sh>=2.2.2",
    "tiktoken>=0.12.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# MLflow tracking is optional. When unavailable the framework falls back
# to NullRecorder + the --output JSON dump. Install with:
#   uv add memex-eval[mlflow]
mlflow = ["mlflow>=3.1"]
# Hermes integration suite needs the plugin (workspace member) AND the
# hermes-agent Python library, which is git-only via the
# ``hermes-integration`` group at the repo root. The plugin dep is added
# here so ``memex-eval[hermes]`` makes the import work; hermes-agent
# itself comes in via ``uv sync --group hermes-integration``.
hermes = ["memex-hermes-plugin"]

[project.scripts]
memex-eval = "memex_eval.cli:app"

[tool.uv.sources]
memex-common = { workspace = true }
memex-core = { workspace = true }
memex-hermes-plugin = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
raw-options.git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.vcs]
version-file = "src/memex_eval/__about__.py"
